<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subvert Global Community, March 2026</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600&family=Space+Mono&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #080809;
    --surface: #0f0f14;
    --text-primary: #f0dfc0;
    --text-secondary: #6a5f50;
    --border: rgba(255, 160, 60, 0.12);
    --cyan: #00ffcc;
    --magenta: #ff40c0;
  }

  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 24px;
  }

  header { text-align: center; margin-bottom: 36px; max-width: 680px; }

  h1 {
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-primary);
    margin-bottom: 8px;
  }

  .subtitle {
    font-size: 0.72rem;
    color: var(--text-secondary);
    font-family: 'Space Mono', monospace;
    letter-spacing: 0.06em;
  }

  .map-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 20px;
    width: 100%;
    max-width: 1100px;
    box-shadow: 0 0 40px rgba(255,100,20,0.06), 0 0 1px rgba(255,160,60,0.2);
  }

  #map-container { width: 100%; position: relative; }
  #map-container svg { width: 100%; height: auto; display: block; }

  .country { cursor: default; }
  .country.has-members { cursor: crosshair; }
  .country.has-members:hover { opacity: 0.72; transition: opacity 0.12s; }

  .legend {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 16px;
    justify-content: center;
  }
  .legend-label {
    font-size: 0.62rem;
    color: var(--text-secondary);
    font-family: 'Space Mono', monospace;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .legend-swatch { width: 36px; height: 7px; border-radius: 0; }
  .legend-bar { display: flex; gap: 1px; margin: 0 10px; }

  .loading {
    text-align: center;
    padding: 80px 0;
    color: var(--text-secondary);
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .error {
    color: #ff4444;
    font-size: 0.8rem;
    text-align: center;
    padding: 20px;
    font-family: 'Space Mono', monospace;
  }

  #tooltip {
    position: fixed;
    pointer-events: none;
    display: none;
    background: #08080e;
    border: 1px solid rgba(0, 255, 220, 0.22);
    border-radius: 3px;
    padding: 11px 14px;
    min-width: 180px;
    box-shadow: 0 0 28px rgba(0,255,200,0.06), 0 0 1px rgba(0,255,200,0.18);
    z-index: 100;
  }
  .tt-country {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--cyan);
    margin-bottom: 9px;
    white-space: nowrap;
  }
  .tt-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 20px;
    margin-bottom: 5px;
  }
  .tt-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.6rem;
    color: var(--magenta);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .tt-value {
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    color: var(--text-primary);
  }
  .tt-bar-track {
    height: 3px;
    background: rgba(255,255,255,0.05);
    margin-top: 8px;
    overflow: hidden;
  }
  .tt-bar-fill {
    height: 100%;
    background: linear-gradient(to right, var(--magenta), var(--cyan));
    transition: width 0.08s;
  }
</style>
</head>
<body>

<header>
  <h1>Subvert Global Community, March 2026</h1>
  <p class="subtitle">121 countries · 18,000+ members worldwide</p>
</header>

<div class="map-card">
  <div id="map-container">
    <div class="loading" id="loading">Loading map data…</div>
  </div>
  <div class="legend" id="legend" style="display:none">
    <span class="legend-label">Fewer</span>
    <div class="legend-bar" id="legend-bar"></div>
    <span class="legend-label">More</span>
  </div>
</div>

<div id="tooltip">
  <div class="tt-country" id="tt-name"></div>
  <div class="tt-row">
    <span class="tt-label">Members</span>
    <span class="tt-value" id="tt-count"></span>
  </div>
  <div class="tt-row">
    <span class="tt-label">% of total</span>
    <span class="tt-value" id="tt-pct"></span>
  </div>
  <div class="tt-bar-track">
    <div class="tt-bar-fill" id="tt-bar" style="width:0%"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>

const countryNames = {
  "4":"Afghanistan","8":"Albania","12":"Algeria","24":"Angola","32":"Argentina",
  "51":"Armenia","36":"Australia","40":"Austria","31":"Azerbaijan","50":"Bangladesh",
  "56":"Belgium","84":"Belize","112":"Belarus","68":"Bolivia","70":"Bosnia and Herzegovina",
  "76":"Brazil","100":"Bulgaria","116":"Cambodia","124":"Canada","152":"Chile",
  "156":"China","170":"Colombia","188":"Costa Rica","191":"Croatia","192":"Cuba",
  "196":"Cyprus","203":"Czech Republic","208":"Denmark","214":"Dominican Republic",
  "218":"Ecuador","818":"Egypt","222":"El Salvador","233":"Estonia","231":"Ethiopia",

  "422":"Lebanon","428":"Latvia","440":"Lithuania","442":"Luxembourg","504":"Morocco",
  "458":"Malaysia","470":"Malta","484":"Mexico","498":"Moldova","496":"Mongolia",

  "600":"Paraguay","604":"Peru","608":"Philippines","616":"Poland","620":"Portugal",
  "630":"Puerto Rico","634":"Qatar","638":"Réunion","642":"Romania","643":"Russia",
  "682":"Saudi Arabia","686":"Senegal","690":"Seychelles","702":"Singapore",
  "703":"Slovakia","705":"Slovenia","710":"South Africa","410":"South Korea",
  "724":"Spain","144":"Sri Lanka","752":"Sweden","756":"Switzerland","158":"Taiwan",
  "834":"Tanzania","764":"Thailand","788":"Tunisia","792":"Turkey","800":"Uganda",
  "804":"Ukraine","784":"United Arab Emirates","826":"United Kingdom",
  "840":"United States","858":"Uruguay","704":"Vietnam","716":"Zimbabwe",

const alpha2ToNumeric = {
  "US":"840", "GB":"826", "CA":"124", "DE":"276",
  "AU":"36",  "FR":"250", "ES":"724", "IT":"380",
  "PT":"620", "CH":"756", "NL":"528", "SE":"752",
  "NZ":"554", "IE":"372", "AT":"40",  "BE":"56",
  "NO":"578", "DK":"208", "JP":"392", "FI":"246",
  "BR":"76",  "ID":"360", "PL":"616", "GR":"300",
  "MX":"484", "IN":"356", "CZ":"203", "ZA":"710",
  "AR":"32",  "TR":"792", "RU":"643", "CO":"170",
  "EE":"233", "RO":"642", "SG":"702", "HU":"348",
  "RS":"688", "GE":"268", "SK":"703", "SI":"705",
  "HR":"191", "IS":"352", "CL":"152", "LT":"440",
  "TW":"158", "NG":"566", "BG":"100", "PH":"608",
  "KR":"410", "VN":"704", "MY":"458", "IL":"376",
  "PE":"604", "UY":"858", "TN":"788", "LV":"428",
  "LU":"442", "HK":"344", "VE":"862", "CR":"188",
  "TH":"764", "CY":"196", "AE":"784", "PK":"586",
  "KE":"404", "UA":"804", "EC":"218", "GH":"288",
  "EG":"818", "MA":"504", "MT":"470", "CN":"156",
  "SV":"222", "PR":"630", "LK":"144", "XK":"926",
  "MK":"807", "BA":"70",  "QA":"634", "BD":"50",
  "JM":"388", "DO":"214", "BY":"112", "SA":"682",
  "AZ":"31",  "GU":"316", "AL":"8",   "LB":"422",
  "GT":"320", "NA":"516", "UG":"800", "KH":"116",
  "KZ":"398", "RE":"638", "IR":"364", "MN":"496",
  "TZ":"834", "KG":"417", "BZ":"84",  "AM":"51",
  "CU":"192", "PY":"600", "ZW":"716", "MZ":"508",
  "JO":"400", "SC":"690", "HN":"340", "PA":"591",
  "ET":"231", "KW":"414", "MD":"498", "SN":"686",
  "ZM":"894"
};

const totalMembers  = Object.values(memberData).reduce((a, b) => a + b, 0);
const cityData = [
  { name: "New York City",  members: 701, lat:  40.7128, lng:  -74.0060 },
  { name: "Berlin",         members: 681, lat:  52.5200, lng:   13.4050 },
  { name: "London",         members: 628, lat:  51.5074, lng:   -0.1278 },
  { name: "Los Angeles",    members: 346, lat:  34.0522, lng: -118.2437 },
  { name: "Toronto",        members: 284, lat:  43.6532, lng:  -79.3832 },
  { name: "Chicago",        members: 233, lat:  41.8781, lng:  -87.6298 },
  { name: "Portland",       members: 228, lat:  45.5051, lng: -122.6750 },
  { name: "Montreal",       members: 224, lat:  45.5017, lng:  -73.5673 },
  { name: "Vancouver",      members: 164, lat:  49.2827, lng: -123.1207 },
  { name: "Seattle",        members: 142, lat:  47.6062, lng: -122.3321 },
  { name: "San Francisco",  members: 126, lat:  37.7249, lng: -122.5000 },
  { name: "Oakland",        members: 121, lat:  37.8044, lng: -122.2712 },
  { name: "Philadelphia",   members: 119, lat:  39.9526, lng:  -75.1652 },
  { name: "Paris",          members: 111, lat:  48.8566, lng:    2.3522 },
  { name: "Bristol",        members: 105, lat:  51.4545, lng:   -2.5879 },
  { name: "Barcelona",      members: 101, lat:  41.3851, lng:    2.1734 },
  { name: "Hamburg",        members:  86, lat:  53.5753, lng:   10.0153 },
  { name: "Austin",         members:  84, lat:  30.2672, lng:  -97.7431 },
  { name: "Amsterdam",      members:  82, lat:  52.3676, lng:    4.9041 },
  { name: "Glasgow",        members:  78, lat:  55.8642, lng:   -4.2518 }
];

const maxCityMembers = Math.max(...cityData.map(d => d.members));
const tooltip = document.getElementById("tooltip");
const ttName  = document.getElementById("tt-name");
const ttCount = document.getElementById("tt-count");
const ttPct   = document.getElementById("tt-pct");
const ttBar   = document.getElementById("tt-bar");

document.addEventListener("mousemove", e => {
  if (tooltip.style.display === "block") {
    const pad = 18;
    const tw = tooltip.offsetWidth;
    const th = tooltip.offsetHeight;
    let x = e.clientX + pad;
    let y = e.clientY + pad;
    if (x + tw > window.innerWidth  - 8) x = e.clientX - tw - pad;
    if (y + th > window.innerHeight - 8) y = e.clientY - th - pad;
    tooltip.style.left = x + "px";
    tooltip.style.top  = y + "px";
  }
});

async function init() {
  try {
    const world = await d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json");
    document.getElementById("loading").remove();

    const width = 1050, height = 550;

    const svg = d3.select("#map-container")
      .append("svg")
      .attr("viewBox", `0 0 ${width} ${height}`)
      .attr("preserveAspectRatio", "xMidYMid meet");

    const projection = d3.geoNaturalEarth1()
      .scale(160).translate([width / 2, height / 2]);
    const path = d3.geoPath().projection(projection);

    // Build numeric-id → count lookup
    const numericToCount = {};
    for (const [a2, count] of Object.entries(memberData)) {
      const num = alpha2ToNumeric[a2];
      if (num) numericToCount[num] = (numericToCount[num] || 0) + count;
    }

    const values = Object.values(memberData).filter(v => v > 0);
    const colorScale = d3.scaleSequentialLog()
      .domain([1, d3.max(values)])
      .interpolator(d3.interpolate("#5c1200", "#ffb300"));

    // Ocean
    svg.append("rect").attr("width", width).attr("height", height).attr("fill", "#06060a");

    // Graticule
    svg.append("path")
      .datum(d3.geoGraticule()())
      .attr("d", path).attr("fill", "none")
      .attr("stroke", "rgba(255,255,255,0.05)").attr("stroke-width", 0.5);

    const countries = topojson.feature(world, world.objects.countries);

    svg.selectAll(".country")
      .data(countries.features)
      .join("path")
      .attr("class", d => {
        const count = numericToCount[String(d.id)];
        return count ? "country has-members" : "country";
      })
      .attr("d", path)
      .attr("fill", d => {
        const count = numericToCount[String(d.id)];
        return count ? colorScale(count) : "#1a1a22";
      })
      .attr("stroke", "#06060a")
      .attr("stroke-width", 0.4)
      .on("mouseenter", function(event, d) {
        const count = numericToCount[String(d.id)];
        if (!count) return;
        const name = countryNames[String(d.id)] || "Unknown";
        const pct  = ((count / totalMembers) * 100).toFixed(1);
        const barW = Math.max(3, (count / totalMembers) * 100);
        ttName.textContent  = name;
        ttCount.textContent = count.toLocaleString();
        ttPct.textContent   = pct + "%";
        ttBar.style.width   = barW + "%";
        tooltip.style.display = "block";
      })
      .on("mouseleave", function() {
        tooltip.style.display = "none";
      });

    // Border mesh
    svg.append("path")
      .datum(topojson.mesh(world, world.objects.countries, (a, b) => a !== b))
      .attr("d", path).attr("fill", "none")
      .attr("stroke", "#06060a").attr("stroke-width", 0.4);

    // Legend
    document.getElementById("legend").style.display = "flex";
    const bar = document.getElementById("legend-bar");
    [1, 3, 10, 30, 100, 500, 2000, 7251].forEach(v => {
      const s = document.createElement("div");
      s.className = "legend-swatch";
      s.style.background = colorScale(v);
      bar.appendChild(s);
    });
    // City circles
    const cityGroup = svg.append("g").attr("class", "city-layer");

    cityGroup.selectAll(".city-dot")
      .data(cityData)
      .join("circle")
      .attr("class", "city-dot")
      .attr("cx", d => projection([d.lng, d.lat])[0])
      .attr("cy", d => projection([d.lng, d.lat])[1])
      .attr("r", 4)
      .attr("fill", "rgba(0,255,204,0.15)")
      .attr("stroke", "#00ffcc")
      .attr("stroke-width", 1.5)
      .style("cursor", "crosshair")
      .on("mouseenter", function(event, d) {
        d3.select(this).attr("fill", "rgba(0,255,204,0.4)");
        const pct = ((d.members / totalMembers) * 100).toFixed(1);
        const barW = Math.max(3, (d.members / maxCityMembers) * 100);
        ttName.textContent  = d.name;
        ttCount.textContent = d.members.toLocaleString();
        ttPct.textContent   = pct + "%";
        ttBar.style.width   = barW + "%";
        tooltip.style.display = "block";
      })
      .on("mouseleave", function() {
        d3.select(this).attr("fill", "rgba(0,255,204,0.15)");
        tooltip.style.display = "none";
      });


  } catch(e) {
    document.getElementById("loading").innerHTML =
      `<div class="error">Failed to load: ${e.message}</div>`;
    console.error(e);
  }
}

init();
</script>
</body>
</html>
